<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e9f6e">
<title>练不虚 · 健身副本</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230e9f6e'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif'>练</text></svg>">
<style>
  :root {
    --green:#0e9f6e; --green-dark:#0b7d56; --green-soft:#e9f7f1;
    --bg:#f5f7fa; --card:#fff; --tx:#1f2937; --sub:#6b7280; --line:#eef0f3;
    --warn:#f59e0b; --warn-soft:#fef3c7; --danger:#ef4444; --gold:#c99a2e;
    --r-lg:20px; --r-md:14px; --r-sm:12px; --pill:999px;
    --shadow:0 4px 16px rgba(0,0,0,.04);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--tx); font-size:15px; line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding-bottom:calc(64px + var(--safe-b));
  }

  /* 数字统一等宽（对齐、不跳动）—— 高级感的细节之一 */
  .kv b, .hero-no, .prog .lab b, .hero-exp .lab span:last-child, .stage-tile b, .pn-row .v b {
    font-variant-numeric:tabular-nums;
  }

  /* ===== 深空主题（body.dark）=====
     参考「Earth Online · 健身副本」的高级感来源：近黑底 + 金色点缀 + 极细分割线 + 等宽数字。
     这里保留我们自己的绿作为主色（品牌一致性），把「深色 + 克制」这套做法借过来。 */
  body.dark {
    --bg:#05070d; --card:#0c1119; --tx:#eef1f6; --sub:#8b95a7; --line:#1a2030;
    --green:#19c389; --green-dark:#12a877; --green-soft:#0d251e;
    --warn-soft:#2a2011; --gold:#e0b45c;
    --shadow:0 6px 22px rgba(0,0,0,.55);
  }
  body.dark .card { border:1px solid #1a2334;
    background:linear-gradient(180deg,#0e1421,#0b101a);
    box-shadow:0 1px 0 rgba(255,255,255,.035) inset, 0 10px 26px -10px rgba(0,0,0,.6); }
  body.dark .card h2 { color:#3ddc9a; }
  body.dark .appbar { background:linear-gradient(140deg,#071614,#0b2a22 60%,#0e3529);
    border-bottom:1px solid #14251f; box-shadow:0 1px 0 rgba(255,255,255,.03) inset; }
  body.dark .tabbar { background:#080c13; border-top-color:#151b28; }
  body.dark .chip { background:#0f141e; border-color:#1e2634; color:var(--sub); }
  body.dark .chip.on { background:var(--green); border-color:var(--green); color:#04140e; }
  body.dark .kv > div { background:#0d1a17; }
  body.dark .kv b { color:#4ee5ac; }
  body.dark .tag { background:#0f2a22; color:#4ee5ac; }
  body.dark .tag.gray { background:#161c27; color:#7d8798; }
  body.dark .tag.warn { background:#2a2011; color:#e0b45c; }
  body.dark .tag.gold { background:#2a2213; color:#e0b45c; }
  body.dark .btn { color:#04140e; }
  body.dark .btn.ghost { background:#0f2a22; color:#4ee5ac; }
  body.dark .btn.line { background:#0f141e; color:var(--sub); border-color:#1e2634; }
  body.dark .prog .track { background:#161c27; }
  body.dark .heat span { background:#111721; color:#6b7484; }
  body.dark .heat span.hit { background:var(--green); color:#04140e; }
  body.dark .heat span.part { background:#0f2a22; color:#4ee5ac; }
  body.dark .setgrid input { background:#0c1119; color:var(--tx); border-color:#1e2634; }
  body.dark .sug-i { background:#0c1119; }
  body.dark .fgrid-i, body.dark .fcat-i { background:#0c1119; border-color:#1e2634; }
  body.dark .fgrid-i:active { background:#12241f; }
  body.dark .stage-tile { background:#0f141e; }
  body.dark .stage-tile b { color:#4ee5ac; }
  body.dark .stage-tile.cur { background:#0f2a22; border-color:var(--green); }
  body.dark .sheet { background:#0c1119; }
  body.dark .toast { background:#e8eef5; color:#0b0f16; }
  body.dark .badge-ic { background:#0f2a22; color:#4ee5ac; }
  body.dark .badge-tile.locked .badge-ic { background:#141a24; color:#4a5262; }
  body.dark .skel { background:linear-gradient(90deg,#101620 25%,#18202c 37%,#101620 63%); background-size:400% 100%; }
  body.dark .empty { color:#5c6577; }
  /* 输入类控件：深色下必须显式给底色，否则浏览器默认白底会在暗色卡片上"发光"
     （记录页的体重输入框就踩过：只设了 border 没设 background） */
  body.dark input, body.dark textarea, body.dark select {
    background:#0b1018; color:var(--tx); border-color:#1e2634;
  }
  body.dark input::placeholder, body.dark textarea::placeholder { color:#5b6478; }
  body.dark input:focus, body.dark textarea:focus { border-color:var(--green); outline:none; }
  body.dark .ex-thumb { background:#141a24; }
  /* 扫描线：一层极淡的横纹，廉价但极有效的"屏幕感" */
  body.dark::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:99;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px); }
  /* 顶部一条品牌色微光 */
  body.dark::before { content:''; position:fixed; top:0; left:0; right:0; height:1px; z-index:100;
    background:linear-gradient(90deg,transparent,rgba(25,195,137,.65),transparent); }

  /* 深空主题下的角色卡：更暗、更"仪表盘"，靠内描边和微光撑质感 */
  body.dark .hero { background:linear-gradient(158deg,#071310 0%,#0a2119 52%,#0e3125 100%);
    box-shadow:0 14px 34px rgba(0,0,0,.6), inset 0 0 0 1px rgba(25,195,137,.16); }
  body.dark .hero-av img { filter:drop-shadow(0 12px 20px rgba(0,0,0,.6)); }
  body.dark .hero-exp .track { background:rgba(255,255,255,.14); }
  body.dark .hero-exp .fill { background:linear-gradient(90deg,#19c389,#7ef0c2); }
  body.dark .hero-badge { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.1); }
  body.dark .tierbar i { background:rgba(255,255,255,.14); }
  body.dark .tierbar i.on { background:#19c389; box-shadow:0 0 8px rgba(25,195,137,.7); }
  #app { max-width:560px; margin:0 auto; padding:14px 14px 20px; }
  @media (min-width:860px){ #app { max-width:900px; } }

  .appbar { position:sticky; top:0; z-index:6; margin:-14px -14px 12px; padding:14px 16px 12px;
    background:linear-gradient(135deg,var(--green-dark),var(--green)); color:#fff; border-radius:0 0 var(--r-lg) var(--r-lg); }
  .appbar h1 { margin:0; font-size:17px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .appbar .sub { font-size:12px; opacity:.9; margin-top:2px; }

  .card { background:linear-gradient(180deg,#ffffff,#fcfdfe); border:1px solid #eef1f5; border-radius:var(--r-lg);
    padding:18px 16px; margin-bottom:14px;
    box-shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px -14px rgba(16,24,40,.14); }
  .card h2 { margin:0 0 12px; font-size:15px; font-weight:700; color:var(--green-dark);
    display:flex; justify-content:space-between; align-items:center;
    border-left:3px solid var(--green); padding-left:10px; line-height:1.35; }
  .card > *:last-child { margin-bottom:0; }
  .card h2 .mini { font-size:12px; color:var(--sub); font-weight:400; }
  .muted { color:var(--sub); font-size:13px; }
  .txs { font-size:12px; }
  .row { display:flex; align-items:center; gap:10px; }
  .row.between { justify-content:space-between; }
  .wrap-row { display:flex; flex-wrap:wrap; gap:8px; }
  .grow { flex:1; }

  .chip { padding:7px 15px; border-radius:var(--pill); border:2px solid var(--line); background:#fff;
    font-size:13px; color:var(--sub); cursor:pointer; transition:transform .08s ease, border-color .15s ease, background .15s ease; }
  .chip:active { transform:scale(.94); }
  .chip.on { background:var(--green); border-color:var(--green); color:#fff; font-weight:600; }
  .tag { display:inline-block; padding:2px 9px; border-radius:var(--pill); background:var(--green-soft);
    color:var(--green); font-size:11px; font-weight:600; }
  .tag.warn { background:var(--warn-soft); color:#b45309; }
  .tag.gray { background:#f1f3f5; color:var(--sub); }
  .tag.gold { background:#fdf3dc; color:var(--gold); }

  .btn { display:block; width:100%; padding:13px; border:0; border-radius:var(--r-md);
    background:var(--green); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .btn.ghost { background:var(--green-soft); color:var(--green); }
  .btn.line { background:#fff; color:var(--sub); border:2px solid var(--line); }
  .btn:disabled { opacity:.55; }

  .prog { margin:8px 0 2px; }
  .prog .lab { display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin-bottom:4px; }
  .prog .track { height:9px; background:var(--line); border-radius:var(--pill); overflow:hidden; }
  .prog .fill { height:100%; background:var(--green); border-radius:var(--pill); transition:width .35s; }
  .prog .fill.warn { background:var(--warn); } .prog .fill.over { background:var(--danger); }

  .kv { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .kv > div { background:var(--green-soft); border-radius:var(--r-sm); padding:9px 6px; text-align:center; }
  .kv b { display:block; color:var(--green-dark); font-size:18px; }
  .kv span { font-size:11px; color:var(--sub); }

  .li { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);
    border-radius:10px; transition:background .12s ease; }
  .li:hover { background:rgba(14,159,110,.05); }
  .li:last-child { border-bottom:0; }
  .li .nm { flex:1; font-size:14px; }
  .li .mc { font-size:12px; color:var(--sub); }
  .empty { text-align:center; color:var(--sub); font-size:13px; padding:22px 0; }
  .form-err { margin-top:10px; font-size:13px; color:#b42318; background:#fef3f2;
    border:1px solid #fecdca; border-radius:var(--r-sm); padding:9px 12px; }
  body.dark .form-err { color:#ff9b8f; background:#2a1512; border-color:#4d211c; }

  .tabbar { position:fixed; left:0; right:0; bottom:0; z-index:8; display:grid;
    grid-template-columns:repeat(5,1fr); background:#fff; border-top:1px solid var(--line);
    padding-bottom:var(--safe-b); max-width:560px; margin:0 auto; }
  @media (min-width:860px){ .tabbar { max-width:900px; } }
  .tabbar button { border:0; background:none; padding:8px 0 7px; font-size:11px; color:var(--sub); cursor:pointer; }
  .tabbar button.on { color:var(--green); font-weight:600; }
  .tabbar .ic { display:block; font-size:19px; line-height:1.25; }

  .toast { position:fixed; left:50%; bottom:calc(78px + var(--safe-b)); transform:translateX(-50%);
    background:#1f2937; color:#fff; padding:10px 18px; border-radius:var(--r-sm); font-size:13px;
    z-index:99; max-width:86vw; text-align:center; }
  .mask { position:fixed; inset:0; background:rgba(17,24,39,.45); display:flex; align-items:center;
    justify-content:center; z-index:2500; padding:18px; }
  .sheet { background:#fff; border-radius:var(--r-lg); padding:18px; width:100%; max-width:420px; max-height:82vh; overflow:auto; }
  .sheet h3 { margin:0 0 10px; font-size:16px; }

  .skel { background:linear-gradient(90deg,#eef1f4 25%,#f6f8fa 37%,#eef1f4 63%);
    background-size:400% 100%; animation:sk 1.2s ease infinite; border-radius:var(--r-sm); height:14px; margin:8px 0; }
  @keyframes sk { 0%{background-position:100% 0} 100%{background-position:0 0} }

  .ex-card { display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line); }
  .ex-card:last-child { border-bottom:0; }
  .ex-thumb { width:74px; height:74px; border-radius:var(--r-sm); object-fit:cover; background:#eef1f4; flex:none; }
  .ex-info { flex:1; min-width:0; }
  .ex-info b { font-size:14px; }
  .setgrid { display:grid; grid-template-columns:34px 1fr 1fr 42px; gap:6px; align-items:center; margin-top:6px; font-size:13px; }
  .setgrid input { width:100%; padding:7px 8px; border:2px solid var(--line); border-radius:9px; font-size:14px; text-align:center; }
  .setgrid .cbdone { display:flex; align-items:center; justify-content:center; }
  .setgrid .hdr { font-size:11px; color:var(--sub); text-align:center; }
  .heat { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .heat span { aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-size:12px; border-radius:8px; background:#f4f6f8; color:var(--sub); }
  .heat span.hdr { background:none; color:var(--sub); font-size:11px; aspect-ratio:auto; }
  .heat span.hit { background:var(--green); color:#fff; font-weight:600; }
  .heat span.part { background:var(--green-soft); color:var(--green-dark); }
  .heat span.today { outline:2px solid var(--green-dark); }

  .badge-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px 6px; }
  .badge-tile { text-align:center; }
  .badge-ic { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--green-soft); color:var(--green-dark); font-size:22px; margin:0 auto 4px; }
  .badge-tile.locked .badge-ic { background:#f1f3f5; color:#b9bec7; }
  .badge-tile span { font-size:11px; color:var(--sub); }

  /* ===== 存档页：玩家角色卡 ===== */
  .hero { position:relative; overflow:hidden; border-radius:var(--r-lg); margin-bottom:12px;
    background:linear-gradient(155deg,#0a7350 0%,#0e9f6e 55%,#19bb84 100%); color:#fff;
    box-shadow:0 10px 26px rgba(14,159,110,.30); }
  .hero::after { content:''; position:absolute; right:-70px; top:-70px; width:230px; height:230px;
    border-radius:50%; background:rgba(255,255,255,.085); }
  .hero::before { content:''; position:absolute; left:-40px; bottom:-60px; width:170px; height:170px;
    border-radius:50%; background:rgba(255,255,255,.06); }
  .hero-in { position:relative; z-index:1; display:flex; gap:14px; align-items:center; padding:16px 16px 8px; }
  /* 角色形象：透明底 PNG。各阶段宽高比不同（0.57~0.64），所以固定**高度**、宽度自适应，
     否则换阶段时角色会忽大忽小。 */
  .hero-av { flex:none; position:relative; height:190px; display:flex; align-items:flex-end;
    justify-content:center; }
  .hero-av img { height:100%; width:auto; display:block;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.30)); }
  .hero-av .ph { width:110px; height:100%; border-radius:12px; background:rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center; font-size:34px; }
  .hero-main { flex:1; min-width:0; }
  .hero-who { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .hero-who b { font-size:19px; }
  .hero-no { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; font-weight:700;
    letter-spacing:.5px; padding:2px 8px; border-radius:var(--pill); background:rgba(255,255,255,.22); }
  .hero-no.gold { background:linear-gradient(135deg,#ffe08a,#e0a92c); color:#5a3f06;
    box-shadow:0 2px 9px rgba(224,169,44,.55); }
  .hero-title { margin-top:7px; font-size:13px; opacity:.95; }
  .hero-title b { font-size:16px; }
  .hero-exp { margin-top:10px; }
  .hero-exp .lab { display:flex; justify-content:space-between; font-size:11px; opacity:.92; margin-bottom:4px; }
  .hero-exp .track { height:8px; border-radius:var(--pill); background:rgba(255,255,255,.26); overflow:hidden; }
  .hero-exp .fill { height:100%; border-radius:var(--pill); background:linear-gradient(90deg,#fff,#d9f7ea);
    transition:width .4s; }
  .hero-unlock { margin-top:7px; font-size:11px; opacity:.9; }
  .hero-badges { position:relative; z-index:1; display:flex; gap:6px; flex-wrap:wrap; padding:2px 16px 12px; }
  .hero-badge { font-size:11px; padding:3px 10px; border-radius:var(--pill);
    background:rgba(255,255,255,.19); border:1px solid rgba(255,255,255,.16); }
  .hero-badge.gold { background:linear-gradient(135deg,#ffe08a,#e0a92c); color:#5a3f06;
    border-color:transparent; font-weight:700; }

  /* 段位进度（11 段） */
  .tierbar { display:flex; gap:4px; }
  .tierbar i { flex:1; height:5px; border-radius:var(--pill); background:rgba(255,255,255,.24); }
  .tierbar i.on { background:#fff; }

  /* ===== 形象墙（我的页）：5 个成长阶段 ===== */
  .stage-row { display:flex; gap:6px; }
  .stage-tile { flex:1; min-width:0; text-align:center; border-radius:var(--r-sm); padding:6px 2px 5px;
    background:#f7f9fa; border:2px solid transparent; }
  .stage-tile img { width:100%; height:76px; object-fit:contain; display:block; }
  .stage-tile b { display:block; font-size:11px; color:var(--green-dark); margin-top:2px; }
  .stage-tile span { display:block; font-size:10px; color:var(--sub); }
  .stage-tile.locked { opacity:.45; }
  .stage-tile.locked img { filter:grayscale(1); }
  .stage-tile.cur { border-color:var(--green); background:var(--green-soft); }

  /* ===== 建档页 ===== */
  .act-list { display:flex; flex-direction:column; gap:8px; }
  .act-item { display:block; width:100%; text-align:left; padding:11px 13px; margin:0;
    border:2px solid var(--line); border-radius:12px; background:transparent;
    font-family:inherit; cursor:pointer; transition:border-color .15s, background .15s; }
  .act-item .act-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .act-item .act-top b { font-size:14px; font-weight:600; color:var(--tx); }
  .act-item .act-factor { font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums; flex:none; }
  .act-item .act-desc { display:block; font-size:12px; color:var(--sub); margin-top:3px; line-height:1.5; }
  .act-item.on { border-color:var(--green); background:var(--green-soft); }
  .act-item.on .act-top b { color:var(--green-dark); }
  .act-item.on .act-factor { color:var(--green-dark); font-weight:700; }
  .act-hint { margin-top:10px; font-size:12px; line-height:1.6; }
  .act-hint .muted { color:var(--sub); }
  body.dark .act-item { border-color:#1e2634; background:#0f141e; }
  body.dark .act-item.on { border-color:rgba(25,195,137,.55); background:rgba(25,195,137,.12); }
  body.dark .act-item.on .act-top b, body.dark .act-item.on .act-factor { color:#3ddc9a; }


  .ob-label { font-size:12px; color:var(--sub); margin:12px 0 6px; }
  .ob-label:first-child { margin-top:0; }
  .ob-num { display:flex; align-items:center; gap:8px; margin:10px 0; }
  .ob-num-k { width:44px; flex:none; font-size:13px; color:var(--sub); }
  .ob-inp { flex:1; min-width:0; padding:9px 10px; border:2px solid var(--line); border-radius:10px;
    font-size:15px; font-family:inherit; background:#fff; color:var(--tx); text-align:center;
    font-variant-numeric:tabular-nums; }
  .ob-inp.wide { text-align:left; font-size:14px; }
  .ob-inp:focus { border-color:var(--green); outline:none; }
  body.dark .ob-inp { background:#0c1119; color:var(--tx); border-color:#1e2634; }
  .ob-unit { flex:none; width:26px; font-size:12px; color:var(--sub); }
  .ob-hint { flex-basis:100%; font-size:11px; color:var(--sub); padding-left:52px; margin-top:-4px; }
  .ob-num:has(.ob-hint) { flex-wrap:wrap; }

  /* 搭配体检提示 */
  .combo-hint { margin-top:10px; padding:9px 11px; border-radius:10px; font-size:12px; line-height:1.6;
    background:rgba(245,158,11,.10); border:1px solid rgba(245,158,11,.32); color:#8a5a06; }
  .combo-hint:first-letter { font-size:13px; }
  body.dark .combo-hint { background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.3); color:#e9c179; }

  /* ===== 完整版（付费理由）===== */
  .pro-card { border:1px solid rgba(217,165,65,.42) !important;
    background:linear-gradient(150deg,rgba(217,165,65,.10),rgba(217,165,65,.02)) !important; }
  .pro-card h2 { color:#8a6410; }
  body.dark .pro-card { border-color:rgba(217,165,65,.38) !important;
    background:linear-gradient(150deg,rgba(217,165,65,.13),rgba(217,165,65,.02)) !important; }
  body.dark .pro-card h2 { color:#e8c46a; }
  body.dark .pro-card div[style*="border-bottom"] { border-color:#2a2114 !important; }

  /* ===== 排行榜 ===== */
  .me-rank { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:12px 0 calc(var(--r-md)) 0;
    background:linear-gradient(120deg,rgba(14,159,110,.14),rgba(14,159,110,.03)) !important;
    border:1px solid rgba(14,159,110,.28); }
  .mr-left { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .mr-rank { font-size:18px; font-weight:700; color:var(--green-dark); }
  body.dark .mr-rank { color:#3ddc9a; }
  .mr-right { text-align:right; }
  .mr-right b { display:block; font-size:18px; }
  .warn-card { border:1px solid rgba(245,158,11,.35) !important;
    background:linear-gradient(120deg,rgba(245,158,11,.10),transparent) !important; }
  .rank-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .rank-row:last-child { border-bottom:0; }
  .rank-row.me { background:var(--green-soft); border-radius:10px; padding:9px 10px; margin:2px 0; }
  body.dark .rank-row.me { background:rgba(25,195,137,.12); }
  .rank-row .rk { width:26px; flex:none; text-align:center; font-size:14px; font-weight:700; color:var(--sub); }
  .rank-row .rn { flex:1; min-width:0; display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
  .rank-row .rn b { font-size:14px; }
  .rank-row .rn .muted { flex-basis:100%; }
  .rank-row .rv { flex:none; font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
  .rank-row .rv i { font-size:11px; font-weight:400; font-style:normal; color:var(--sub); margin-left:2px; }

  /* ===== 训练日志：一句话 + 照片 + 突破 ===== */
  .note-card textarea.note-text { width:100%; min-height:88px; resize:vertical; line-height:1.65;
    font:inherit; font-size:14px; }
  .note-subject { width:100%; margin-bottom:8px; }
  #noteCard input, #noteCard textarea { width:100%; }
  .note-count { text-align:right; font-size:11px; color:var(--sub); margin:4px 0 10px; }
  .note-actions { display:flex; gap:10px; margin-top:12px; }
  .note-actions .btn { flex:1; margin:0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { border:1px solid var(--line); background:transparent; color:var(--sub);
    border-radius:var(--pill); padding:5px 12px; font-size:12px; font-family:inherit; cursor:pointer; }
  .chip.on { border-color:var(--green); color:var(--green-dark); background:var(--green-soft); font-weight:600; }
  body.dark .chip { border-color:var(--line); color:var(--sub); background:transparent; }
  body.dark .chip.on { color:#3ddc9a; background:rgba(25,195,137,.14); border-color:rgba(25,195,137,.5); }

  /* 照片格子 */
  .ph-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .ph-grid.sm { gap:6px; margin-top:8px; }
  .ph-item { position:relative; width:82px; height:82px; }
  .ph-item img { width:100%; height:100%; object-fit:cover; border-radius:10px; display:block; }
  .ph-del { position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%;
    border:0; background:rgba(0,0,0,.62); color:#fff; font-size:14px; line-height:1; cursor:pointer; }
  .ph-add { width:82px; height:82px; border-radius:10px; border:1px dashed var(--line);
    background:transparent; color:var(--sub); font-size:16px; font-family:inherit; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .ph-add.wide { width:100%; height:auto; padding:16px 12px; gap:4px; }
  .ph-add.wide span { font-size:13px; }
  .ph-add.wide .muted { font-size:11px; }
  .ph-thumb { width:64px; height:64px; padding:0; border:0; background:none; cursor:pointer; }
  .ph-thumb img { width:100%; height:100%; object-fit:cover; border-radius:8px; display:block; }

  /* 突破徽章 */
  .pr-box { margin:10px 0; }
  .pr-line { display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:1.5;
    padding:7px 10px; border-radius:10px; margin-bottom:6px;
    background:linear-gradient(90deg,rgba(217,165,65,.16),rgba(217,165,65,.02));
    border-left:3px solid #d9a441; }
  .pr-tag { flex:none; font-size:11px; font-weight:700; color:#7a5a10; background:#f7d774;
    border-radius:var(--pill); padding:1px 8px; margin-top:1px; }
  body.dark .pr-tag { color:#3a2a03; }
  body.dark .pr-line { background:linear-gradient(90deg,rgba(217,165,65,.18),rgba(217,165,65,.02)); }

  /* 时间线 */
  .timeline { position:relative; }
  .tl-item { position:relative; padding:0 0 16px 14px; border-left:2px solid var(--line); }
  .tl-item:last-child { border-left-color:transparent; padding-bottom:2px; }
  .tl-item::before { content:''; position:absolute; left:-6px; top:4px; width:10px; height:10px;
    border-radius:50%; background:var(--green); box-shadow:0 0 0 3px var(--card, #fff); }
  body.dark .tl-item::before { box-shadow:0 0 0 3px var(--card); }
  .tl-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .tl-head b { font-size:14px; }
  .tl-meta { font-size:11px; color:var(--green-dark); background:var(--green-soft);
    border-radius:var(--pill); padding:1px 8px; }
  .tl-meta.rest { color:var(--sub); background:rgba(127,127,127,.12); }
  body.dark .tl-meta { color:#3ddc9a; background:rgba(25,195,137,.14); }
  .tl-note { margin-top:6px; }
  .tl-tag { display:inline-block; font-size:11px; color:var(--green-dark); background:var(--green-soft);
    border-radius:var(--pill); padding:1px 8px; margin-bottom:4px; }
  body.dark .tl-tag { color:#3ddc9a; background:rgba(25,195,137,.14); }
  .tl-subject { font-size:13px; font-weight:600; margin-bottom:2px; }
  .tl-text { font-size:13px; line-height:1.65; color:var(--tx); white-space:pre-wrap; word-break:break-word; }
  .tl-edit { margin-top:8px; border:1px solid var(--line); background:transparent; color:var(--sub);
    border-radius:var(--pill); padding:3px 12px; font-size:11px; font-family:inherit; cursor:pointer; }

  /* ===== 玩家编号说明行 ===== */
  .pn-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .pn-row:last-child { border-bottom:0; }
  .pn-row .k { width:74px; flex:none; font-size:12px; color:var(--sub); }
  .pn-row .v { flex:1; font-size:14px; }

  /* ===== 完整版（Pro）：周期表 / 重量处方 / 激活码 ===== */
  .cyc-row { padding:9px 10px; border-bottom:1px solid var(--line); }
  .cyc-row:last-child { border-bottom:0; }
  .cyc-row.cur { background:var(--green-soft); border-radius:var(--r-sm); }
  .cyc-h { display:flex; align-items:center; gap:8px; font-size:13px; }
  .cyc-h .m { margin-left:auto; color:var(--sub); font-size:12px; font-variant-numeric:tabular-nums; }
  .cyc-b { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:4px; font-size:12px; color:var(--sub);
    font-variant-numeric:tabular-nums; }
  .px-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .px-row:last-child { border-bottom:0; }
  .px-nm { flex:1; min-width:0; }
  .px-wt { font-family:ui-monospace,Menlo,monospace; font-size:16px; font-weight:700; color:var(--green-dark);
    white-space:nowrap; font-variant-numeric:tabular-nums; }
  .px-wt.bw { font-size:13px; font-weight:400; color:var(--sub); }
  /* ⚠️ input 必须显式设 background —— 深空主题下不设会变成白底发光块 */
  .pro-input { width:100%; padding:11px 12px; border:2px solid var(--line); border-radius:var(--r-sm);
    font-size:15px; background:var(--card); color:var(--tx); margin-top:8px; }
  .tier-lock { text-align:center; padding:4px 0 0; }
  .tier-lock .big { font-size:30px; line-height:1.2; }

  /* ===== 食物库：常见食材 chips + 搜索联想 ===== */
  .chip.sm { padding:5px 11px; font-size:12px; border-width:1px; }
  .fc-sec { display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--line); }
  .fc-sec:last-child { border-bottom:0; }
  .fc-sec > .tag { flex:none; margin-top:3px; }
  .fc-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .food-hit { display:flex; align-items:center; gap:8px; padding:10px 12px; border:1px solid var(--line);
    border-radius:var(--r-sm); margin-bottom:6px; cursor:pointer; }
  .food-hit:active { background:var(--green-soft); }
  .food-hit .txs { margin-left:auto; white-space:nowrap; }

  /* ===== 训练：加/减组 + 重量滑动面板 ===== */
  .setops { display:flex; gap:8px; margin-top:8px; }
  .setops button { flex:1; padding:8px; border-radius:var(--r-sm); border:1px dashed var(--line);
    background:transparent; color:var(--sub); font-size:12px; font-family:inherit; cursor:pointer; }
  .setops button:active { background:var(--green-soft); color:var(--green-dark); }
  .wslider { text-align:center; padding:2px 0 0; }
  .wslider .val { font-family:ui-monospace,Menlo,monospace; font-size:40px; font-weight:700;
    color:var(--green-dark); font-variant-numeric:tabular-nums; line-height:1.15; }
  .wslider .val span { font-size:14px; font-weight:400; color:var(--sub); }
  .wslider input[type=range] { width:100%; margin:14px 0 4px; accent-color:var(--green); }
  .wslider .ends { display:flex; justify-content:space-between; font-size:11px; color:var(--sub); }
  .wstep { display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .wstep button { min-width:78px; padding:10px 12px; border-radius:var(--r-sm); border:2px solid var(--line);
    background:var(--card); color:var(--tx); font-size:14px; font-family:inherit; cursor:pointer; }
  .wstep button:active { background:var(--green-soft); }
  .wquick { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; }
  .ex-how { margin-top:6px; border-top:1px dashed var(--line); padding-top:6px; }
  .ex-how .hd { font-size:12px; color:var(--green-dark); font-weight:600; }
  .ex-how .ln { font-size:12px; color:var(--sub); line-height:1.7; }

  /* ===== 修炼改版（2026-10-16）：洞府首页 + 训练执行页 ===== */
  /* 境界徽记：角色区里 Lv 旁边的阶段名 */
  .realm-tag { font-size:12px; font-weight:700; padding:3px 10px; border-radius:var(--pill);
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22); color:#fff; }
  body:not(.dark) .realm-tag { background:var(--green-soft); border-color:var(--green); color:var(--green-dark); }
  /* 今日训练卡：一页只有这一个强按钮 */
  .today-card { border-left:3px solid var(--green); }
  .today-stats { display:flex; gap:6px; margin-top:10px; }
  .today-stats > div { flex:1; text-align:center; background:var(--green-soft); border-radius:var(--r-sm); padding:8px 2px; }
  .today-stats b { display:block; font-size:19px; font-variant-numeric:tabular-nums; color:var(--green-dark); }
  .today-stats span { font-size:11px; color:var(--sub); }
  .today-card.rest { border-left-color:var(--line); }
  .btn.big { padding:15px; font-size:17px; font-weight:800; letter-spacing:2px;
    box-shadow:0 6px 16px rgba(25,195,137,.35); }
  .btn.big:active { transform:scale(.98); }
  /* 并列入口（藏经阁 / 随身导师） */
  .duo-row { display:flex; gap:10px; margin-bottom:12px; }
  .duo { flex:1; margin:0; text-align:center; padding:14px 8px; cursor:pointer; }
  .duo:active { transform:scale(.97); }
  .duo-ic { font-size:26px; line-height:1.3; }
  .duo b { display:block; margin-top:2px; }
  /* 按需展开：训练页的说明类内容统一收进 details */
  details.fold { background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:12px 16px; margin-bottom:12px; }
  details.fold > summary { cursor:pointer; font-weight:700; font-size:14px; list-style:none; position:relative;
    padding-right:22px; }
  details.fold > summary::after { content:'▾'; position:absolute; right:2px; top:0; color:var(--sub);
    transition:transform .15s; }
  details.fold[open] > summary::after { transform:rotate(180deg); }
  details.fold[open] > summary { margin-bottom:6px; }
  /* 底部浮动组间计时条：可收起，不遮挡输入 */
  #restBar { position:fixed; left:10px; right:10px; bottom:64px; z-index:9998; max-width:520px; margin:0 auto;
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:rgba(9,14,11,.96); color:#fff; border:1px solid rgba(25,195,137,.5);
    border-radius:14px; box-shadow:0 10px 26px rgba(0,0,0,.45);
    animation:rbIn .18s ease-out; }
  @keyframes rbIn { from { transform:translateY(14px); opacity:0 } to { transform:none; opacity:1 } }
  #restBar .rb-num { font-family:ui-monospace,Menlo,monospace; font-size:26px; font-weight:800;
    color:#7ef0c2; font-variant-numeric:tabular-nums; min-width:74px; }
  #restBar .rb-lab { flex:1; font-size:12px; color:#cfd6d2; line-height:1.35; }
  #restBar .rb-ops { display:flex; gap:6px; }
  #restBar .chip.sm { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.2); color:#fff; }
  body.dark #restBar { background:rgba(6,10,8,.97); }
  /* 双帧循环动图（对齐小程序 frame-gif：起始↔结束两帧自动交替） */
  .ex-frames { position:relative; overflow:hidden; }
  .ex-frames img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ex-frames img.f1 { animation:exflip 1.1s infinite; }
  @keyframes exflip { 0%,49.9% { opacity:0 } 50%,100% { opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .ex-frames img.f1 { animation:none; opacity:0 } }
</style>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  .cover { position:relative; width:1080px; height:1440px; background:url('小红书健身干货类笔记封面背景图_3_4竖版_风格_真实健身房_2026-10-11T13-10-59.png') center/cover; overflow:hidden; }
  .shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,14,24,.88) 0%, rgba(10,14,24,.55) 45%, rgba(10,14,24,.15) 75%); }
  .main { position:absolute; top:90px; left:80px; right:80px; }
  .q { font-size:56px; font-weight:800; color:#ffd54a; letter-spacing:2px; margin-bottom:28px; }
  .l1 { font-size:104px; font-weight:900; color:#fff; line-height:1.3; letter-spacing:3px; }
  .hl { color:#ff5a3c; background:rgba(255,255,255,.96); padding:4px 22px; border-radius:14px; font-size:88px; font-weight:900; }
  .cross { position:absolute; top:620px; left:80px; right:80px; font-size:44px; color:rgba(255,255,255,.85); line-height:1.7; }
  .cross s { text-decoration:none; }
  .cross .no::before { content:"✕ "; color:#ff6b6b; font-weight:800; }
  .cross .yes::before { content:"✓ "; color:#5dff9e; font-weight:800; }
  .foot { position:absolute; bottom:70px; left:80px; right:80px; background:rgba(255,255,255,.94); color:#111; border-radius:20px; padding:28px 34px; font-size:40px; font-weight:800; text-align:center; }
  .foot span { color:#ff5a3c; }
</style>
</head>
<body>
<div class="cover">
  <div class="shade"></div>
  <div class="main">
    <div class="q">练了半年，卧推还在原地？</div>
    <div class="l1">你的计划缺了<br>最关键的一行<br><span class="hl">练多重</span></div>
  </div>
    <div class="cross">
      <div class="no">只写「卧推 4×8」——重量全靠猜</div>
      <div class="no">网上抄的计划——那是别人的重量</div>
      <div class="yes">按你的体重经验，算出每个动作的 kg</div>
    </div>
  <div class="foot">练不虚 · 免费版就能看自己<span>今天的重量处方</span></div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>热量计算器 · 练不虚Gym</title>
<style>
  :root { --g:#0e9f6e; --gd:#0b7d56; --bg:#f5f7fa; --card:#fff; --tx:#1f2937; --sub:#6b7280; --line:#eef0f3; --warn:#f59e0b; --danger:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif; font-size:15px; }
  .wrap { max-width:1080px; margin:0 auto; padding:18px 14px 60px; }
  header { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  header h1 { font-size:20px; margin:0; color:var(--gd); }
  header .tip { font-size:12px; color:var(--sub); }
  .cols { display:grid; grid-template-columns: 1fr 1.15fr; gap:14px; align-items:start; }
  @media (max-width: 860px){ .cols { grid-template-columns: 1fr; } }
  .card { background:var(--card); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 12px; color:var(--gd); }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  .fld { flex:1; min-width:110px; }
  .fld label { display:block; font-size:12px; color:var(--sub); margin-bottom:4px; }
  .fld input, .fld select { width:100%; padding:8px 10px; border:2px solid var(--line); border-radius:8px; font-size:14px; background:#fff; }
  .fld input:focus, .fld select:focus { outline:none; border-color:var(--g); }
  .seg { display:flex; flex-wrap:wrap; gap:8px; }
  .seg button { padding:7px 14px; border-radius:999px; border:2px solid var(--line); background:#fff; font-size:13px; cursor:pointer; color:var(--sub); }
  .seg button.on { background:var(--g); border-color:var(--g); color:#fff; font-weight:600; }
  .targets { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
  .tg { background:#f0faf5; border-radius:10px; padding:10px; text-align:center; }
  .tg b { display:block; font-size:20px; color:var(--gd); }
  .tg span { font-size:11px; color:var(--sub); }
  .calc { font-size:12.5px; color:var(--sub); line-height:1.9; margin-top:10px; }
  .calc b { color:var(--tx); }
  .bar { margin:8px 0 4px; }
  .bar .lab { display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin-bottom:3px; }
  .bar .lab b { color:var(--tx); }
  .track { height:10px; background:var(--line); border-radius:99px; overflow:hidden; }
  .fill { height:100%; background:var(--g); border-radius:99px; transition:width .3s; }
  .fill.over { background:var(--danger); }
  input.foodq { width:100%; padding:11px 14px; border:2px solid var(--g); border-radius:10px; font-size:15px; background:#fff; }
  .cats { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .cats button { padding:5px 13px; border-radius:999px; border:2px solid var(--line); background:#fff; font-size:12.5px; cursor:pointer; color:var(--sub); }
  .cats button.on { background:var(--g); border-color:var(--g); color:#fff; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .fi { background:#fff; border:2px solid var(--line); border-radius:10px; padding:8px 11px; cursor:pointer; }
  .fi:active { border-color:var(--g); background:#f2fbf7; }
  .fi b { display:block; font-size:13.5px; }
  .fi span { font-size:11px; color:var(--sub); }
  .loglist { margin-top:6px; }
  .li { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .li .nm { flex:1; }
  .li .mc { color:var(--sub); font-size:12px; }
  .li .del { color:var(--danger); cursor:pointer; padding:0 6px; font-weight:600; }
  .empty { color:var(--sub); font-size:13px; padding:16px 0; text-align:center; }
  .datebar { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .datebar button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 12px; cursor:pointer; font-size:13px; }
  .datebar input { border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:13px; }
  .gmodal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:9; }
  .gbox { background:#fff; border-radius:14px; padding:22px; width:min(92vw,380px); }
  .gbox h3 { margin:0 0 4px; font-size:17px; }
  .gbox .per { font-size:12px; color:var(--sub); margin-bottom:12px; }
  .gbox input { width:100%; padding:10px 12px; border:2px solid var(--g); border-radius:8px; font-size:16px; }
  .gbox .quick { display:flex; gap:8px; margin:10px 0 14px; flex-wrap:wrap; }
  .gbox .quick button { flex:1; padding:7px 0; border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; font-size:13px; }
  .gbox .go { width:100%; padding:11px 0; background:var(--g); color:#fff; border:0; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
  .gbox .cancel { width:100%; padding:9px 0; background:none; border:0; color:var(--sub); font-size:13px; cursor:pointer; margin-top:4px; }
  .custom { margin-top:10px; font-size:13px; color:var(--g); cursor:pointer; text-align:center; }
  .cform { display:none; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .cform.show { display:grid; }
  .cform .full { grid-column:1/-1; }
  .cform input { width:100%; padding:8px 10px; border:2px solid var(--line); border-radius:8px; font-size:13px; }
  .cform button { grid-column:1/-1; padding:10px 0; background:var(--g); color:#fff; border:0; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .note { font-size:12px; color:var(--sub); margin-top:10px; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔥 热量计算器 <span style="font-size:12px;color:var(--sub);font-weight:400">练不虚Gym</span></h1>
    <div class="tip">数据保存在本机浏览器 · 换设备不同步</div>
  </header>

  <div class="cols">
    <!-- 左：档案 + 目标 -->
    <div>
      <div class="card">
        <h2>① 我的档案</h2>
        <div class="row">
          <div class="fld"><label>性别</label><select id="gender"><option>男</option><option>女</option></select></div>
          <div class="fld"><label>年龄</label><input id="age" type="number" value="30"></div>
          <div class="fld"><label>身高 cm</label><input id="height" type="number" value="183"></div>
          <div class="fld"><label>体重 kg</label><input id="weight" type="number" step="0.1" value="93"></div>
        </div>
        <div style="margin-top:12px"><label style="font-size:12px;color:var(--sub)">① 生活底数（不看训练，只看日常生活）</label>
          <div class="seg" id="lifeSeg"></div>
        </div>
        <div style="margin-top:12px"><label style="font-size:12px;color:var(--sub)">② 每周训练档（每次 ≥60 分钟中高强度）</label>
          <div class="seg" id="trainSeg"></div>
        </div>
        <div class="row" style="margin-top:12px">
          <div class="fld"><label>体质类型</label><select id="bodyType"><option>易胖</option><option selected>中性</option><option>易瘦</option></select></div>
          <div class="fld"><label>目标</label><select id="goal"><option selected>增肌减脂同步</option><option>增肌</option><option>减脂</option><option>塑形</option></select></div>
        </div>
        <div style="margin-top:12px"><label style="font-size:12px;color:var(--sub)">热量缺口：安全范围 <b id="safeTxt">200-300</b> kcal（谭成义：大缺口掉肌肉）</label>
          <input id="deficit" type="range" min="0" max="500" step="50" value="200" style="width:100%">
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub)"><span>0 维持</span><span>500</span></div>
        </div>
      </div>

      <div class="card">
        <h2>② 每日消耗与目标（谭成义宏量模型）</h2>
        <div class="calc" id="calcLine"></div>
        <div class="targets">
          <div class="tg"><b id="tgKcal">-</b><span>热量 kcal</span></div>
          <div class="tg"><b id="tgP">-</b><span>蛋白质 g</span></div>
          <div class="tg"><b id="tgC">-</b><span>碳水 g</span></div>
          <div class="tg"><b id="tgF">-</b><span>脂肪 g</span></div>
        </div>
        <div class="note" id="fatNote"></div>
      </div>

      <div class="card">
        <h2>③ 今天怎么分配（分餐建议）</h2>
        <div id="mealSplit" style="font-size:13.5px;line-height:1.7"></div>
        <div class="note">按 早 25% / 午 35% / 练后 10% / 晚 30% 分配；练后那餐以蛋白粉 + 快碳水为主。早餐碳水优先燕麦/面条/面包，午晚优先米饭/红薯/杂粮。</div>
      </div>
    </div>

    <!-- 右：记录 -->
    <div>
      <div class="card">
        <h2>④ 今天吃了什么</h2>
        <div class="datebar">
          <button onclick="shiftDay(-1)">← 前一天</button>
          <input type="date" id="date" onchange="render()">
          <button onclick="shiftDay(1)">后一天 →</button>
          <button onclick="toToday()" style="color:var(--g);font-weight:600">今天</button>
        </div>
        <input class="foodq" id="q" placeholder="打字搜食物，如：鸡胸 / 米饭 / 西兰花" oninput="renderFood()">
        <div class="cats" id="cats"></div>
        <div class="grid" id="grid"></div>
        <div class="custom" onclick="toggleCustom()">＋ 库里没有？自定义食物（填一次自动记住）</div>
        <div class="cform" id="cform">
          <input class="full" id="cName" placeholder="食物名称，如：羊肉">
          <input id="cK" placeholder="热量 kcal/100g"><input id="cP" placeholder="蛋白 g/100g">
          <input id="cC" placeholder="碳水 g/100g"><input id="cF" placeholder="脂肪 g/100g">
          <input class="full" id="cFb" placeholder="膳食纤维 g/100g（选填）">
          <button onclick="addCustom()">保存并加入</button>
        </div>
      </div>

      <div class="card">
        <h2>⑤ 已吃记录 vs 目标 <span id="dayLabel" style="font-weight:400;font-size:12px;color:var(--sub)"></span></h2>
        <div id="bars"></div>
        <div class="loglist" id="loglist"></div>
        <div style="text-align:right;margin-top:10px"><span style="font-size:12px;color:var(--danger);cursor:pointer" onclick="clearDay()">清空当天记录</span></div>
      </div>
    </div>
  </div>
</div>

<div class="gmodal" id="gm" onclick="if(event.target===this)closeG()">
  <div class="gbox">
    <h3 id="gName"></h3>
    <div class="per" id="gPer"></div>
    <input id="gGrams" type="number" placeholder="吃了多少克？默认 100" oninput="liveHint()">
    <div id="gHint" style="font-size:12.5px;color:var(--gd);margin-top:6px;min-height:18px"></div>
    <div class="quick">
      <button onclick="setG(50)">50g</button><button onclick="setG(100)">100g</button>
      <button onclick="setG(150)">150g</button><button onclick="setG(200)">200g</button><button onclick="setG(250)">250g</button>
    </div>
    <button class="go" onclick="confirmG()">加入记录</button>
    <button class="cancel" onclick="closeG()">取消</button>
  </div>
</div>

// 生活底数：久坐1.2 / 轻活1.375（走动多、5000-8000步）/ 体力活1.5（体力劳动或日均万步+）
const LIFE = [

]

  { key:'0',   name:'不练',              ses:0 },

]

const FAT_GKG   = { '增肌':0.7, '塑形':0.7, '增肌减脂同步':0.7, '减脂':0.8 }
const BODY_CARB = { '易胖':2.5, '中性':3.0, '易瘦':3.5 }
const round = (n,d=0)=>{const p=Math.pow(10,d);return Math.round(n*p)/p}
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v))
// 常见份量换算（「约几个 / 几碗 / 几块」）
const PORTION = {
  '鸡蛋':{per:50,unit:'个'}, '米饭(熟)':{per:150,unit:'碗'}, '糙米饭(熟)':{per:150,unit:'碗'},
  '馒头':{per:100,unit:'个'}, '红薯':{per:200,unit:'个'}, '香蕉':{per:120,unit:'根'},
  '全麦面包':{per:35,unit:'片'}, '鸡胸肉':{per:120,unit:'块'}, '牛奶':{per:250,unit:'盒'},
  '玉米(鲜)':{per:200,unit:'根'}, '苹果':{per:200,unit:'个'}, '蛋白粉(乳清)':{per:30,unit:'勺'},
  '面条(熟)':{per:250,unit:'碗'}, '土豆(蒸)':{per:150,unit:'个'}, '紫薯':{per:150,unit:'个'}
}
function portionHint(name, grams){
  const u = PORTION[name]
  if (!u || !grams) return ''
  const n = grams / u.per
  if (n < 0.4) return ''
  return '（约 ' + (n >= 10 ? Math.round(n) : Math.round(n * 10) / 10) + ' ' + u.unit + '）'
}

  protein: [['鸡胸肉','鸡胸'],['牛肉(瘦)','瘦牛肉'],['虾','虾'],['鸡蛋','鸡蛋']],

  carbAM: [['燕麦片','燕麦'],['面条(熟)','面条'],['全麦面包','全麦面包']],
  carbMain: [['米饭(熟)','米饭'],['红薯','红薯'],['糙米饭(熟)','糙米饭']],
  fat: [['食用油','油'],['花生','花生'],['牛油果','牛油果']]
}

function engine(p, deficit){
  const bmr = Math.round(10*p.weight + 6.25*p.height - 5*p.age + (p.gender==='男'?5:-161))
  const life = LIFE.find(a=>a.key===p.life) || LIFE[0]
  const tr   = TRAIN.find(a=>a.key===p.train) || TRAIN[3]
  const trainBonus = round(0.045 * tr.ses, 2)
  const factor = Math.round(clamp(life.base + trainBonus, 1.2, 1.9)*100)/100
  const tdee = Math.round(bmr*factor)
  const targetKcal = Math.round(tdee - deficit)
  // 谭成义宏量：脂肪按体重档，碳水按体质基准；蛋白反向；缺口用碳水弹性补齐
  let carbG = clamp(BODY_CARB[p.bodyType] - (p.goal==='减脂'?0.5:p.goal==='增肌减脂同步'?0.3:0), 1.5, 6.5)
  let protG = clamp(1.6 - (carbG-3.0)*0.3 + (p.goal==='增肌'||p.goal==='增肌减脂同步'||p.goal==='减脂'?0.2:0), 1.2, 2.2)
  const fat = Math.round(FAT_GKG[p.goal]*p.weight)
  const protein = Math.round(protG*p.weight)
  // 碳水 = 目标热量补齐项（生理钳制 1.5~6.5g/kg）
  const carb = Math.max(0, Math.round((targetKcal - protein*4 - fat*9)/4))
  const fiberT = Math.round(targetKcal/1000*14)
  return { bmr, life, trainBonus, factor, tdee, targetKcal, protein, carb, fat, protG:round(protG,2), carbG:round(carb/ p.weight,2), fiberT }
}

function gramsForFood(name, target, field){
  const f = FOODS.find(x=>x.n===name); if(!f) return null
  const per = field==='p'?f.p : field==='c'?f.c : f.f
  if (!per) return null
  return Math.max(5, Math.round(target/per*100/5)*5)
}
function renderSplit(e){
  const html = MEALS.map(m=>{
    const P0=Math.round(e.protein*m.pct), C0=Math.round(e.carb*m.pct), F0=Math.round(e.fat*m.pct)
    const isSnack = m.key==='练后'
    const pList = (isSnack?SAMPLES.proteinSnack:SAMPLES.protein).slice(0,isSnack?2:3).map(([f,l])=>{
      const g=gramsForFood(f,P0,'p'); return g? l+' '+g+'g'+portionHint(f,g) : null
    }).filter(Boolean).join(' / ')
    const cList = (m.key==='早'?SAMPLES.carbAM:SAMPLES.carbMain).slice(0,2).map(([f,l])=>{
      const g=gramsForFood(f,C0,'c'); return g? l+' '+g+'g'+portionHint(f,g) : null
    }).filter(Boolean).join(' / ')
    const fList = isSnack ? '' : SAMPLES.fat.slice(0,2).map(([f,l])=>{
      const g=gramsForFood(f,F0,'f'); return g? l+' '+g+'g' : null
    }).filter(Boolean).join(' / ')
    return `<div style="padding:8px 0;border-top:1px solid var(--line)">
      <div style="font-weight:600;color:var(--gd)">${m.name} · 蛋白${P0}g / 碳水${C0}g / 脂肪${F0}g</div>
      <div style="color:var(--sub);font-size:12.5px">蛋白 ${P0}g ≈ ${pList}</div>
      <div style="color:var(--sub);font-size:12.5px">碳水 ${C0}g ≈ ${cList}</div>
      ${fList?`<div style="color:var(--sub);font-size:12.5px">脂肪 ${F0}g ≈ ${fList}</div>`:''}
      <div style="color:var(--sub);font-size:12.5px">蔬菜 ${m.veg}</div>
    </div>`
  }).join('')
  document.getElementById('mealSplit').innerHTML = html
}
function deficitOf(){
  const g = P().goal
  if (g==='减脂') return Math.min(Math.max(P().deficit,200),300)
  if (g==='增肌') return 0
  return P().deficit
}

function liveHint(){
  const g = parseFloat(document.getElementById('gGrams').value)
  const box = document.getElementById('gHint')
  if (!PICK || !g || g <= 0) { box.textContent = ''; return }
  const k = g/100
  box.textContent = `≈ ${Math.round(PICK.k*k)}kcal · 蛋白${round(PICK.p*k,1)}g · 碳水${round(PICK.c*k,1)}g · 脂肪${round(PICK.f*k,1)}g` + portionHint(PICK.n, g)
}
function setG(g){ document.getElementById('gGrams').value = g; liveHint() }
function closeG(){ document.getElementById('gm').style.display = 'none' }
function confirmG(){
  let g = parseFloat(document.getElementById('gGrams').value); if(!g||g<=0) g=100
  const k = g/100
  dayFoods().push({ n:PICK.n, g, kcal:Math.round(PICK.k*k), p:round(PICK.p*k,1), c:round(PICK.c*k,1), f:round(PICK.f*k,1), fb:round(PICK.fb*k,1) })
  save(); closeG(); render()
}
function toggleCustom(){ document.getElementById('cform').classList.toggle('show') }
function addCustom(){
  const n=document.getElementById('cName').value.trim()
  const num=id=>{const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v}
  if(!n) return alert('请填食物名称')
  const f={ n, k:num('cK'), p:num('cP'), c:num('cC'), f:num('cF'), fb:num('cFb'), cat:'自定义' }
  FOODS.push(f); S.custom.push(f); save()
  ;['cName','cK','cP','cC','cF','cFb'].forEach(id=>document.getElementById(id).value='')
  document.getElementById('cform').classList.remove('show')
  toast('已记住「'+n+'」，下次直接搜'); renderFood()
}
function removeLi(i){ dayFoods().splice(i,1); save(); render() }
function clearDay(){ if(confirm('清空 '+CUR+' 的全部记录？')){ S.days[CUR]=[]; save(); render() } }

// —— 汇总渲染 ——
function render(){
  document.getElementById('dayLabel').textContent = '· ' + CUR + (CUR===todayStr()?'（今天）':'')
  const foods = dayFoods()
  const tot = foods.reduce((a,f)=>({kcal:a.kcal+f.kcal,p:a.p+f.p,c:a.c+f.c,f:a.f+f.f,fb:a.fb+f.fb}),{kcal:0,p:0,c:0,f:0,fb:0})
  const e = engine(P(), deficitOf())
  const bar=(lab,val,tgt,unit,overBad)=>{
    const pct = tgt? Math.min(100,Math.round(val/tgt*100)):0
    const over = tgt && val>tgt*1.08
    return `<div class="bar"><div class="lab"><span>${lab}</span><b>${round(val)} / ${tgt} ${unit}</b></div>`+
      `<div class="track"><div class="fill ${over&&overBad?'over':''}" style="width:${pct}%"></div></div></div>`
  }
  document.getElementById('bars').innerHTML =
    bar('热量', tot.kcal, e.targetKcal, 'kcal', true) +
    bar('蛋白质', tot.p, e.protein, 'g') +
    bar('碳水', tot.c, e.carb, 'g', true) +
    bar('脂肪', tot.f, e.fat, 'g', true) +
    bar('膳食纤维', tot.fb, e.fiberT, 'g') +
    `<div style="font-size:12px;color:var(--sub);margin-top:6px">剩余：${Math.max(0,e.targetKcal-Math.round(tot.kcal))} kcal · 蛋白还差 ${Math.max(0,e.protein-Math.round(tot.p))}g</div>`
  document.getElementById('loglist').innerHTML = foods.length
    ? foods.map((f,i)=>`<div class="li"><span class="nm">${f.n}</span><span class="mc">${f.g}g · ${f.kcal}kcal · 蛋白${f.p} 碳水${f.c} 脂肪${f.f}</span><span class="del" onclick="removeLi(${i})">✕</span></div>`).join('')
    : '<div class="empty">还没记录，点上面的食物或搜索添加</div>'
}
function toast(m){ const t=document.createElement('div'); t.textContent=m
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:99'
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200) }

// —— 启动 ——
S.custom.forEach(f=>{ if(!FOODS.find(x=>x.n===f.n)) FOODS.push(f) })
document.getElementById('date').value = CUR
buildSeg(); bindProfile(); buildCats(); calc(); renderFood(); render()
</script>
